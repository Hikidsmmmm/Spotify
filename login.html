<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Login • VibeFlow</title>
  <link rel="stylesheet" href="login.css">
</head>
<body>

<div class="login-wrapper">
  <div class="login-card">

    <div class="login-icon">➜</div>

    <h1 class="login-title">Welcome back</h1>
    <p class="login-subtitle">Log in to your account</p>

    <button class="google-btn">
      <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="google-icon">
      Continue with Google
    </button>

    <div class="divider">
      <span>OR</span>
    </div>

    <label>Email</label>
    <input id="emailInput" type="email" placeholder="you@example.com">

    <label>Password</label>
    <input id="passwordInput" type="password" placeholder="••••••••">

    <a class="forgot" href="#">Forgot password?</a>

    <button id="loginBtn" class="login-btn">Log in</button>

    <p class="signup-text">
      Don’t have an account?
      <a href="#">Create one</a>
    </p>

  </div>
</div>

<script>
  document.getElementById("loginBtn").onclick = () => {
    const email = emailInput.value.trim();
    if (!email) return alert("Enter an email");

    localStorage.setItem("vf_current_user", email);
    location.href = "index.html";
  };
</script>

</body>
</html>
