<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify Clone</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="style.css" 
    <link rel="stylesheet" href="https://cloudflare.com">
</head>
<body>
    <div class="container">
        <!-- Sidebar Section -->
        <nav class="sidebar">
            <div class="logo">
                <i class="fab fa-spotify"></i> <span>Spotify</span>
            </div>
            <ul>
               <li><a href="index.html"><i class="fa fa-home"></i> Home</a></li>
                <li><a href="search.html"><i class="fa fa-search"></i> Search</a></li>
                <li><a href="library.html"><i class="fa fa-book"></i> Your Library</a></li>                          
            </ul>
        </nav>

        <!-- Main Content Area -->
        <main class="main-content">
            <header>
                <div class="nav-buttons">
                    <button>&lt;</button>
                    <button>&gt;</button>
                </div>
            </header>
            <section class="playlists">
                <h2>Made For You</h2>
                <div class="card-container">
                    <!-- Example Playlist Card -->
                    <div class="card">
                        <img src="https://i.guim.co.uk/img/media/8752ced487fc0ac9e5856a172f2d9c72a2ef776d/0_2014_5792_3800/master/5792.jpg?" alt="Spotify/Images/NF.jpeg">
                        <h4>Daily Mix 1</h4>
                        <p>Artist Name...</p>
                    </div>
                </div>
            </section>
        </main>

        <!-- Music Player Bar -->
        <footer class="player">
            <div class="now-playing">
                <p>Song Title</p>
                <span>Artist</span>
            </div>
            <div class="player-controls">
                <i class="fas fa-step-backward"></i>
                <i class="fas fa-play-circle fa-2x"></i>
                <i class="fas fa-step-forward"></i>
                <input type="range" class="progress-bar">
            </div>
            <div class="volume-controls">
                <i class="fas fa-volume-up"></i>
                <input type="range">
            </div>
        </footer>
    </div>
</body>
</html>
