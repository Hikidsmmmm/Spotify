<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>VibeFlow</title>
  <link rel="stylesheet" href="home.css">
</head>

<!-- AUTO‑REDIRECT TO LOGIN -->
<script>
  if (!localStorage.getItem("vf_current_user")) {
    location.href = "login.html";
  }
</script>

<body>

<div class="app">

  <!-- SIDEBAR -->
  <aside class="sidebar">
    <h2 class="logo">VibeFlow</h2>

    <nav class="nav">
      <button class="nav-btn active">Home</button>
      <button class="nav-btn">Search</button>
      <button class="nav-btn">Your Library</button>
      <button class="nav-btn">Create Playlist</button>
      <button class="nav-btn">Liked Songs</button>
    </nav>
  </aside>

  <!-- MAIN CONTENT -->
  <main class="main">

    <h1 class="header">Good morning</h1>

    <!-- RECENTLY PLAYED -->
    <h2 class="section-title">Recently Played</h2>
    <div class="grid" id="recentGrid"></div>

    <!-- POPULAR -->
    <h2 class="section-title">Popular</h2>
    <div class="grid" id="popularGrid"></div>

    <!-- MADE FOR YOU -->
    <h2 class="section-title">Made For You</h2>
    <div class="grid" id="madeGrid"></div>

  </main>

</div>

<!-- PLAYER BAR -->
<div class="player-bar">
  <div class="player-left">No song playing</div>

  <div class="player-center">
    <button>⏮</button>
    <button class="play-btn">▶</button>
    <button>⏭</button>
  </div>

  <div class="player-right">
    <span>0:00</span>
    <div class="progress"></div>
    <span>0:00</span>
  </div>
</div>
<script>
  if (!localStorage.getItem("vf_current_user")) {
    location.href = "login.html";
  }
</script>
<script src="home.js"></script>
</body>
</html>
